name: Firmware Builder

on:
  push:  # 任何分支的推送都可以触发
    branches:
      - '**'  # 匹配所有分支
  pull_request:
    branches:
      - '**'  # 匹配所有 PR

jobs:
  esp32c3:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境来构建

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        ./bin/arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        ./bin/arduino-cli core update-index
        ./bin/arduino-cli core install esp32:esp32

    - name: Install specific PN532 library version
      run: |
        export ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL=true
        ./bin/arduino-cli lib install --git-url "https://github.com/tatanakots/PN532.git"

    - name: Install FastLED library
      run: |
        ./bin/arduino-cli lib install "FastLED"

    - name: Compile ESP32-C3 firmware
      run: |
        ./bin/arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-property "build.extra_flags=-DUSB_CDC_ON_BOOT" --build-path ./build/esp32.esp32.esp32c3/ ./ArduinoArcadeCardReader.ino

    - name: Upload firmware binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32c3-firmware
        path: ./build/esp32.esp32.esp32c3/*.bin
        if-no-files-found: error
  esp8266:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境来构建

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        ./bin/arduino-cli config init --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
        ./bin/arduino-cli core update-index
        ./bin/arduino-cli core install esp8266:esp8266

    - name: Install specific PN532 library version
      run: |
        export ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL=true
        ./bin/arduino-cli lib install --git-url "https://github.com/tatanakots/PN532.git"

    - name: Install FastLED library
      run: |
        ./bin/arduino-cli lib install "FastLED"

    - name: Compile ESP8266 firmware
      run: |
        ./bin/arduino-cli compile --fqbn esp8266:esp8266:generic --build-path ./build/esp8266.esp8266.generic/ ./ArduinoArcadeCardReader.ino

    - name: Upload firmware binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp8266-firmware
        path: ./build/esp8266.esp8266.generic/*.bin
        if-no-files-found: error
  air001:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境来构建

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        ./bin/arduino-cli config init --additional-urls https://github.com/Air-duino/Arduino-pack-json-ci/releases/download/Nightly/package_air_index.json
        ./bin/arduino-cli core update-index
        ./bin/arduino-cli core install AirM2M:AirMCU

    - name: Install specific PN532 library version
      run: |
        export ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL=true
        ./bin/arduino-cli lib install --git-url "https://github.com/tatanakots/PN532.git"

    - name: Install FastLED library
      run: |
        ./bin/arduino-cli lib install "FastLED"

    - name: Compile Air001 firmware
      run: |
        ./bin/arduino-cli compile --fqbn AirM2M:AirMCU:Air001Dev --build-path ./build/AirM2M.AirMCU.Air001Dev/ ./ArduinoArcadeCardReader.ino

    - name: Upload firmware binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: air001-firmware
        path: ./build/AirM2M.AirMCU.Air001Dev/*.bin
        if-no-files-found: error

